services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      SAMPLE_DATASET_PATH: /app/genz_social_media_usage_1M.csv
      DATABASE_PATH: /app/backend/storage/datainsight.db
      STORAGE_DIR: /app/backend/storage
      UPLOAD_DIR: /app/backend/storage/uploads
      PROCESSED_DIR: /app/backend/storage/processed
      REPORT_DIR: /app/backend/storage/reports
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/backend/storage
      - ./genz_social_media_usage_1M.csv:/app/genz_social_media_usage_1M.csv:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      - backend

